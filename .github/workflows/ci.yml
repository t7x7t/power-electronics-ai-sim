name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            pyproject.toml

      - name: Install the verified test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tested.txt
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Validate JSON Schemas and example configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          root = Path.cwd()
          experiment_schema = json.loads((root / "schemas/experiment.schema.json").read_text(encoding="utf-8"))
          manifest_schema = json.loads((root / "schemas/manifest.schema.json").read_text(encoding="utf-8"))
          example = json.loads((root / "examples/buck_pi_step/config.json").read_text(encoding="utf-8"))
          ngspice_example = json.loads((root / "examples/ngspice_buck_step/config.json").read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator.check_schema(experiment_schema)
          jsonschema.Draft202012Validator.check_schema(manifest_schema)
          jsonschema.Draft202012Validator(experiment_schema).validate(example)
          jsonschema.Draft202012Validator(experiment_schema).validate(ngspice_example)
          print("validated experiment schema and reference configurations")
          print(f"manifest schema title: {manifest_schema['title']}")
          PY

      - name: Run test suite
        run: python -m pytest -q --basetemp .pytest_ci -o cache_dir=.pytest_cache

      - name: Run CLI smoke test
        shell: bash
        run: |
          python -m pe_sim.cli --help
          python -m pe_sim.cli run examples/buck_pi_step/config.json --backend buck
          python -c "from pathlib import Path; assert Path('runs/buck-reference/manifest.json').is_file()"

  next-python:
    name: next python / Python 3.13 (compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the range-based test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Record the compatibility environment
        run: python -m pip freeze

      - name: Run test suite
        run: python -m pytest -q --basetemp .pytest_ci_313 -o cache_dir=.pytest_cache

      - name: Run CLI smoke test
        run: |
          python -m pe_sim.cli --help
          python -m pe_sim.cli run examples/buck_pi_step/config.json --backend buck
          python -c "from pathlib import Path; assert Path('runs/buck-reference/manifest.json').is_file()"

  package:
    name: package / wheel install
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          . .wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          pe-sim --version
          python -m pe_sim.cli demo .wheel-demo
          run_dir=$(python -c "from pathlib import Path; print(next(Path('.wheel-demo/runs').iterdir()))")
          python -m pe_sim.cli inspect-run "$run_dir" --compact > /dev/null
          python -m pe_sim.cli capabilities --compact > /dev/null
          echo "wheel smoke test passed"

  release-artifacts:
    name: release artifacts / wheel + inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Check release identity
        run: python scripts/release_record.py check-identity --json

      - name: Write the distribution inventory
        shell: bash
        run: |
          python scripts/distribution_inventory.py dist/*.whl \
            -o dist/distribution-inventory.json \
            --license-file LICENSE \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Write SHA256SUMS.txt for the build output
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          lines = []
          for path in sorted(p for p in dist.rglob("*") if p.is_file()):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              lines.append(f"{digest.hexdigest()}  {path.relative_to(dist).as_posix()}")
          (dist / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print((dist / "SHA256SUMS.txt").read_text(encoding="utf-8"), end="")
          PY

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Record the artifact boundary in the job summary
        shell: bash
        run: |
          {
            echo "## release artifacts / wheel + inventory"
            echo
            echo "- This artifact set is build output only: the wheel, the sdist,"
            echo "  the distribution inventory, and the checksum file."
            echo "- No approval, tag, publication, or release claim is made by this job."
            echo "- Boundaries: \`docs/53_release_governance_v1.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
