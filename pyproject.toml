[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-electronics-ai-sim"
version = "0.2.0"
description = "Auditable, extensible power-electronics simulation runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "jsonschema>=4.20",
    "numpy>=1.24",
    "pytest>=7.4",
]

[project.scripts]
pe-sim = "pe_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
